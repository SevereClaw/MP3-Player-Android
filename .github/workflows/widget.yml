name: Check widget on emulator

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Render widget on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.severeclaw.mp3player android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.severeclaw.mp3player android.permission.READ_MEDIA_AUDIO || true
            adb shell am start -n com.severeclaw.mp3player/.MainActivity --ez test_tone true --ez widget_shot true
            sleep 30
            mkdir -p shots && adb pull /sdcard/Android/data/com.severeclaw.mp3player/files/ shots/ || true
            ls -R shots
            adb logcat -d | grep -E "WIDGETTEST|AndroidRuntime|FATAL" | tail -40 || true
      - name: Print renders
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, glob
          from PIL import Image
          files = sorted(glob.glob("shots/**/*.png", recursive=True))
          ims = [Image.open(f).convert("RGBA") for f in files]
          W = 1000; H = sum(i.height + 20 for i in ims)
          sheet = Image.new("RGB", (W, max(H, 1)), (40, 40, 40))
          y = 0
          for i in ims:
              sheet.paste(i, (0, y), i); y += i.height + 20
          sheet = sheet.resize((W // 2, max(H, 2) // 2))
          buf = io.BytesIO(); sheet.save(buf, "JPEG", quality=80)
          b = base64.b64encode(buf.getvalue()).decode()
          for k in range(0, len(b), 20000):
              print("SHOTPART sheet", k // 20000, b[k:k + 20000])
          PY
