name: Check on emulator

on:
  workflow_dispatch:
    inputs:
      skin:
        description: "skin id"
        default: "flash"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.severeclaw.mp3player android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.severeclaw.mp3player/.MainActivity
            sleep 8
            adb exec-out screencap -p > shot1.png
            adb shell input keyevent KEYCODE_BACK; sleep 1
            adb shell am start -n com.severeclaw.mp3player/.MainActivity; sleep 3
            adb exec-out screencap -p > shot2.png
            adb logcat -d | grep -E "AndroidRuntime|FATAL|mp3player" | tail -40 || true
            echo "SHOT shot1.png $(base64 -w0 shot1.png)"
            echo "SHOT shot2.png $(base64 -w0 shot2.png)"
